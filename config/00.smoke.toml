# 配置说明: 全部字段以小写字母开头
market = "futures/um" # 市场: spot | futures/um | futures/cm
symbol = ["BTCUSDT"] # 下载的交易对列表, 必填

# 冒烟窗口固定为 7 天: 只验证配置 -> 起始日 -> 下载 -> 报告这条完整链路
start = "2026-11-01" # 开始时间, 可选, 默认值: 无, 可选参数: YYYY-MM-DD
end = "2026-11-07" # 结束时间, 可选, 默认值: 昨天, 可选参数: YYYY-MM-DD
# 相对仓库根目录(运行 cargo 时的 cwd), 不是相对本文件; 与真实数据隔离
output_dir = "../data/binance-smoke" # data/ 的父目录
concurrency = 64 # 每个 (symbol × job) 配对内的最大并发下载数, 可选, 默认值: 64

[[dataset]]
type = "klines" # 数据集类型
periods = ["daily"] # daily | monthly
intervals = ["1d"] # K 线周期；非 K 线数据集不要填写
